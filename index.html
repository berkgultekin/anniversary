<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>365 Sebep 💌</title>
  <meta name="description" content="Seni sevmemin 365 sebebi">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#fffdfa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="365 Sebep">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Yüzen kalpler arka planı -->
  <div id="hearts-bg" aria-hidden="true"></div>

  <!-- ============ ANA UYGULAMA ============ -->
  <div id="app" class="hidden">

    <header id="app-header">
      <div class="header-title">
        <h1 id="app-logo">365 Sebep</h1>
        <p class="header-sub">Seni sevmemin 365 sebebi</p>
      </div>
      <div class="married-counter">
        <span id="married-days">0</span>
        <label>gündür evliyiz 💍</label>
      </div>
    </header>

    <!-- BUGÜN -->
    <main id="today-view" class="view">
      <div id="special-badge" class="special-badge hidden"></div>

      <article class="note-card" id="note-card">
        <div class="note-card-deco">✦ &nbsp;💌&nbsp; ✦</div>
        <p class="note-number">Sebep <span id="note-no">#1</span></p>
        <p class="note-date" id="note-date"></p>
        <div class="note-divider"></div>
        <p class="note-text" id="note-text"></p>
        <p class="note-sign">— Berk ❤️</p>
      </article>

      <div class="today-actions">
        <button id="btn-save" class="btn btn-primary">📸 Galeriye Kaydet</button>
        <button id="btn-tomorrow" class="btn btn-ghost">👀 Yarınınkine bakayım…</button>
      </div>
    </main>

    <!-- ARŞİV -->
    <main id="archive-view" class="view hidden">
      <h2 class="archive-title">Geçmiş Sebepler 📖</h2>
      <p class="archive-sub" id="archive-sub"></p>
      <div id="archive-list" class="archive-list"></div>
    </main>

    <!-- ALT MENÜ -->
    <nav id="bottom-nav">
      <button class="nav-btn active" data-view="today-view">💌<span>Bugün</span></button>
      <button class="nav-btn" data-view="archive-view">📖<span>Arşiv</span></button>
    </nav>

    <!-- Trüf — beyaz kedi -->
    <button id="truf-btn" title="Trüf" aria-label="Trüf">
      <svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true">
        <!-- kulaklar -->
        <path d="M14 26 L15 9 L30 19 Z" fill="#ffffff" stroke="#cfc7c1" stroke-width="2" stroke-linejoin="round"/>
        <path d="M50 26 L49 9 L34 19 Z" fill="#ffffff" stroke="#cfc7c1" stroke-width="2" stroke-linejoin="round"/>
        <path d="M18 24 L19 14 L27 20 Z" fill="#f3ccd1"/>
        <path d="M46 24 L45 14 L37 20 Z" fill="#f3ccd1"/>
        <!-- baş -->
        <ellipse cx="32" cy="35" rx="21" ry="19" fill="#ffffff" stroke="#cfc7c1" stroke-width="2"/>
        <!-- gri lekeler -->
        <path d="M32 16 a21 19 0 0 0 -19 12 a21 19 0 0 0 3 14 Z" fill="#eceae8" opacity="0.85"/>
        <!-- gözler -->
        <ellipse cx="24" cy="33" rx="3" ry="3.6" fill="#4a3f3a"/>
        <ellipse cx="40" cy="33" rx="3" ry="3.6" fill="#4a3f3a"/>
        <circle cx="25.1" cy="31.8" r="1" fill="#ffffff"/>
        <circle cx="41.1" cy="31.8" r="1" fill="#ffffff"/>
        <!-- burun ve ağız -->
        <path d="M29.5 41 L34.5 41 L32 44 Z" fill="#e79aa4"/>
        <path d="M32 44 v3 M32 47 q-4 3 -7 0 M32 47 q4 3 7 0" fill="none" stroke="#b9afa8" stroke-width="1.7" stroke-linecap="round"/>
        <!-- bıyıklar -->
        <path d="M17 40 l-9 -3 M17 44 l-9 2 M47 40 l9 -3 M47 44 l9 2" fill="none" stroke="#cfc7c1" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </button>
    <div id="truf-toast" class="hidden"></div>
  </div>

  <!-- Komik ret modalı -->
  <div id="reject-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-emoji" id="reject-emoji">😏</div>
      <p id="reject-text"></p>
      <p id="reject-countdown" class="reject-countdown"></p>
      <button class="btn btn-primary" id="reject-close">Tamam, sabrediyorum 🙄</button>
    </div>
  </div>

  <!-- Arşiv not modalı -->
  <div id="archive-modal" class="modal hidden">
    <div class="modal-card note-card archive-note-card">
      <div class="note-card-deco">✦ &nbsp;💌&nbsp; ✦</div>
      <p class="note-number">Sebep <span id="am-no"></span></p>
      <p class="note-date" id="am-date"></p>
      <div class="note-divider"></div>
      <p class="note-text" id="am-text"></p>
      <p class="note-sign">— Berk ❤️</p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="am-save">📸 Kaydet</button>
        <button class="btn btn-ghost" id="am-close">Kapat</button>
      </div>
    </div>
  </div>

  <canvas id="share-canvas" width="1080" height="1350" class="hidden"></canvas>

  <script src="notes.enc.js"></script>
  <script src="app.js"></script>
</body>
</html>
